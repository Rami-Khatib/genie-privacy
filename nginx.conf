server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The tunnel terminates TLS at Cloudflare, so this server speaks plain HTTP
    # and must not try to redirect to https itself - that would loop.

    charset utf-8;

    # One page. Anything else is this page rather than a 404, so a stale link
    # in a Play listing or an old console entry still reaches the policy.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A privacy policy gets edited when the app changes, and a reviewer must
    # see the current text, so this is deliberately short-lived.
    location = /index.html {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # No third-party anything on this page: no fonts, no analytics, no images.
    # Saying so in a header costs nothing and matches what the page promises.
    add_header Content-Security-Policy
        "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/html text/css;
    gzip_min_length 512;
}
